<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">From discovery to dependable execution</title>
  <desc id="desc">A model discovers a UI workflow. A versioned capability captures inputs, actions, outputs, and checks. A deterministic runtime reuses the capability. Safety policy and evidence span the lifecycle, with live human handoff when needed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102636"/><stop offset="1" stop-color="#182f3e"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b8dfd4" stroke-opacity=".045"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#93baaf" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1200" height="440" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="440" rx="16" fill="url(#grid)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <circle cx="47" cy="39" r="4" fill="#7ae0ba"/>
    <text x="60" y="44" fill="#a9c9c3" font-size="12" font-weight="600" letter-spacing="2">CAPABILITY RUNNER / PLATFORM DESIGN</text>
    <text x="42" y="100" fill="#f4faf8" font-size="34" font-weight="600" letter-spacing="-1">Learn the workflow. Make it repeatable.</text>
    <text x="43" y="131" fill="#a9bfca" font-size="16">A clear contract between model reasoning and reliable execution.</text>
    <rect x="42" y="172" width="330" height="142" rx="10" fill="#203c4b" stroke="#3b5663"/>
    <text x="64" y="201" fill="#8eb2c3" font-size="11" letter-spacing="1.8">01 / DISCOVER</text>
    <text x="64" y="236" fill="#f4faf8" font-size="24" font-weight="600">Model-led exploration</text>
    <text x="64" y="264" fill="#b7cbd3" font-size="14">Observe the live application.</text>
    <text x="64" y="286" fill="#b7cbd3" font-size="14">Choose bounded actions toward a goal.</text>
    <path d="M381 243H423" stroke="#93baaf" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="434" y="172" width="330" height="142" rx="10" fill="#dcefe7"/>
    <text x="456" y="201" fill="#397365" font-size="11" letter-spacing="1.8">02 / CAPTURE</text>
    <text x="456" y="236" fill="#163d34" font-size="24" font-weight="600">A reusable capability</text>
    <text x="456" y="264" fill="#3f665b" font-size="14">Inputs · actions · outputs · checks</text>
    <text x="456" y="286" fill="#3f665b" font-size="14">Versioned. Parameterized. Reviewable.</text>
    <path d="M773 243H815" stroke="#93baaf" stroke-width="1.6" marker-end="url(#arrow)"/>
    <rect x="826" y="172" width="332" height="142" rx="10" fill="#203c4b" stroke="#3b5663"/>
    <text x="848" y="201" fill="#8eb2c3" font-size="11" letter-spacing="1.8">03 / EXECUTE</text>
    <text x="848" y="236" fill="#f4faf8" font-size="24" font-weight="600">Deterministic replay</text>
    <text x="848" y="264" fill="#b7cbd3" font-size="14">Apply new inputs. Verify the entity.</text>
    <text x="848" y="286" fill="#b7cbd3" font-size="14">Recover, stop, or hand control to a person.</text>
    <path d="M43 340H1157" stroke="#36515e"/>
    <text x="43" y="371" fill="#7ae0ba" font-size="12" font-weight="600" letter-spacing="1.2">ACROSS THE LIFECYCLE</text>
    <text x="43" y="401" fill="#b7cbd3" font-size="14">Explicit safety policy</text>
    <text x="323" y="401" fill="#b7cbd3" font-size="14">Constrained tenant adaptation</text>
    <text x="665" y="401" fill="#b7cbd3" font-size="14">Live human handoff</text>
    <text x="952" y="401" fill="#b7cbd3" font-size="14">Redacted evidence</text>
  </g>
</svg>
